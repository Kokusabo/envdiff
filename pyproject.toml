[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "envdiff"
dynamic = ["version"]
description = "Compare .env files and find missing, extra, or empty variables, with secrets masked."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Kokusabo" }]
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
]
keywords = ["env", "dotenv", "cli", "devtools", "config"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Environment :: Console",
    "Topic :: Software Development :: Build Tools",
]

[project.urls]
Homepage = "https://github.com/Kokusabo/envdiff"
Issues = "https://github.com/Kokusabo/envdiff/issues"
Changelog = "https://github.com/Kokusabo/envdiff/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "build>=1", "twine>=5"]

[project.scripts]
envdiff = "envdiff.cli:app"

[tool.setuptools.dynamic]
version = { attr = "envdiff.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Typer requires Argument/Option calls as parameter defaults.
"src/envdiff/cli.py" = ["B008"]
